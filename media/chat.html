<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src %CSP% https: data:; style-src %CSP% 'unsafe-inline'; script-src 'nonce-%NONCE%';">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{ --gap:10px }
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--vscode-font-family);font-size:var(--vscode-font-size);color:var(--vscode-foreground);background:var(--vscode-sideBar-background);display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,select:focus-visible,textarea:focus-visible{outline:1px solid var(--vscode-focusBorder)}
.top{display:flex;gap:6px;padding:8px 10px;border-bottom:1px solid var(--vscode-panel-border);flex-wrap:wrap;align-items:center}
select{flex:1;min-width:90px;background:var(--vscode-dropdown-background);color:var(--vscode-dropdown-foreground);border:1px solid var(--vscode-dropdown-border);border-radius:4px;padding:3px 6px;font:inherit}
.link{font-size:11px;padding:3px 8px;border-radius:4px;background:var(--vscode-button-background);color:var(--vscode-button-foreground)}
.link:hover{background:var(--vscode-button-hoverBackground)}
#log{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:14px}
.empty{margin:auto;text-align:center;color:var(--vscode-descriptionForeground);display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px}
.empty img{width:56px;height:56px;border-radius:14px}
.empty b{color:var(--vscode-foreground);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px}
.chips button{border:1px solid var(--vscode-panel-border);border-radius:12px;padding:3px 10px;font-size:12px}
.chips button:hover{background:var(--vscode-list-hoverBackground)}
.u{align-self:flex-end;max-width:90%;background:var(--vscode-input-background);border:1px solid var(--vscode-input-border,transparent);border-radius:10px 10px 2px 10px;padding:6px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.a{min-width:0;line-height:1.55;overflow-wrap:anywhere}
.who{font-size:11px;color:var(--vscode-descriptionForeground);margin-bottom:4px}
.a p{margin:0 0 .6em}.a p:last-child{margin:0}
.a code{font-family:var(--vscode-editor-font-family);font-size:.92em;background:var(--vscode-textCodeBlock-background);padding:1px 4px;border-radius:3px}
.a ul,.a ol{margin:.3em 0 .6em;padding-left:1.3em}
.a h3,.a h4{margin:.8em 0 .3em;font-size:1em}
.code{border:1px solid var(--vscode-panel-border);border-radius:6px;margin:.5em 0;overflow:hidden;background:var(--vscode-textCodeBlock-background)}
.code .bar{display:flex;gap:2px;align-items:center;padding:3px 6px;border-bottom:1px solid var(--vscode-panel-border);font-size:11px;color:var(--vscode-descriptionForeground)}
.code .bar span{margin-right:auto;font-family:var(--vscode-editor-font-family)}
.code .bar button{padding:2px 6px;border-radius:3px;font-size:11px}
.code .bar button:hover{background:var(--vscode-toolbar-hoverBackground)}
.code pre{margin:0;padding:8px 10px;overflow-x:auto;font-family:var(--vscode-editor-font-family);font-size:var(--vscode-editor-font-size)}
.link.ghost{background:none;color:var(--vscode-textLink-foreground);border:1px solid var(--vscode-panel-border)}
.tools{display:flex;flex-direction:column;gap:4px;margin-bottom:6px}.tools:empty{display:none}
.tools .info{border:0;padding:1px 0;font-family:var(--vscode-editor-font-family)}
.tools .info::before{content:"● ";color:var(--vscode-textLink-foreground)}
.ap{border:1px solid var(--vscode-focusBorder);border-radius:8px;overflow:hidden;background:var(--vscode-editorWidget-background)}
.ap.done{border-color:var(--vscode-panel-border);opacity:.9}
.ap .h{display:flex;align-items:center;gap:6px;padding:6px 8px;font-size:12px;border-bottom:1px solid var(--vscode-panel-border)}
.ap .h b{font-family:var(--vscode-editor-font-family);font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ap .h .p{color:var(--vscode-gitDecoration-addedResourceForeground,#3fb950)}.ap .h .m{color:var(--vscode-gitDecoration-deletedResourceForeground,#f85149)}
.ap .d{font-family:var(--vscode-editor-font-family);font-size:12px;max-height:220px;overflow:auto;margin:0;padding:4px 0}
.ap .d div{white-space:pre;padding:0 8px}
.ap .d .a{background:var(--vscode-diffEditor-insertedLineBackground,rgba(63,185,80,.15));color:var(--vscode-foreground)}
.ap .d .r{background:var(--vscode-diffEditor-removedLineBackground,rgba(248,81,73,.15));color:var(--vscode-foreground)}
.ap .d .s{color:var(--vscode-descriptionForeground);text-align:center}
.ap .q{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:6px 8px;border-top:1px solid var(--vscode-panel-border);font-size:12px}
.ap .q span{margin-right:auto}
.ap .q button{font-size:11.5px;padding:3px 9px;border-radius:4px;border:1px solid var(--vscode-panel-border)}
.ap .q button.y{background:var(--vscode-button-background);color:var(--vscode-button-foreground);border-color:transparent}
.ap .q button:hover{filter:brightness(1.1)}
.info{font-size:11px;color:var(--vscode-descriptionForeground);border:1px dashed var(--vscode-panel-border);border-radius:6px;padding:3px 8px;align-self:flex-start}
.prop{border:1px solid var(--vscode-focusBorder);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:var(--vscode-editorWidget-background)}
.prop.done{border-color:var(--vscode-panel-border)}
.prop b{font-size:12px}
.frow{display:flex;align-items:center;gap:6px;font-size:12px}
.frow .fn{font-family:var(--vscode-editor-font-family);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .st{font-family:var(--vscode-editor-font-family);font-size:11px}
.frow .st .p{color:var(--vscode-gitDecoration-addedResourceForeground,#3fb950)}.frow .st .m{color:var(--vscode-gitDecoration-deletedResourceForeground,#f85149)}
.frow .new{font-size:10px;border:1px solid var(--vscode-panel-border);border-radius:8px;padding:0 5px}
.frow button,.prop .acts button{font-size:11px;padding:2px 7px;border-radius:4px;border:1px solid var(--vscode-panel-border)}
.frow button:hover,.prop .acts button:hover{background:var(--vscode-toolbar-hoverBackground)}
.prop .acts{display:flex;gap:6px;flex-wrap:wrap}
.prop .acts .pri{background:var(--vscode-button-background);color:var(--vscode-button-foreground);border-color:transparent}
.ok{color:var(--vscode-gitDecoration-addedResourceForeground,#3fb950)}
.err{color:var(--vscode-errorForeground);border:1px solid var(--vscode-inputValidation-errorBorder);border-radius:6px;padding:6px 10px}
.err button{text-decoration:underline;margin-left:4px}
.cursor::after{content:"▍";animation:b 1s steps(2) infinite;color:var(--vscode-textLink-foreground)}
@keyframes b{50%{opacity:0}}
.bottom{border-top:1px solid var(--vscode-panel-border);padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.ctx{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--vscode-descriptionForeground)}
.ctx button{border:1px solid var(--vscode-panel-border);border-radius:10px;padding:1px 8px;font-size:11px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctx button.off{opacity:.5;text-decoration:line-through}
.box{display:flex;gap:6px;align-items:flex-end;background:var(--vscode-input-background);border:1px solid var(--vscode-input-border,var(--vscode-panel-border));border-radius:6px;padding:4px 4px 4px 8px}
.box:focus-within{border-color:var(--vscode-focusBorder)}
textarea{flex:1;border:0;background:none;color:var(--vscode-input-foreground);font:inherit;resize:none;outline:none;max-height:160px;min-height:20px;padding:3px 0}
#send{background:var(--vscode-button-background);color:var(--vscode-button-foreground);border-radius:4px;padding:4px 10px;font-size:12px}
#send:hover{background:var(--vscode-button-hoverBackground)}
.hint{font-size:10.5px;color:var(--vscode-descriptionForeground)}
#slash{display:none;flex-direction:column;border:1px solid var(--vscode-panel-border);border-radius:6px;background:var(--vscode-editorWidget-background);max-height:180px;overflow-y:auto}
#slash button{text-align:left;padding:4px 8px;font-size:12px;display:flex;gap:8px}
#slash button b{font-family:var(--vscode-editor-font-family);color:var(--vscode-textLink-foreground);font-weight:normal}
#slash button span{color:var(--vscode-descriptionForeground);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#slash button:hover,#slash button.on{background:var(--vscode-list-hoverBackground)}
</style>
</head>
<body>
<div class="top">
  <select id="prov" title="IA"></select>
  <select id="model" title="Modèle"></select>
  <button class="link" id="linkBtn" hidden>Lier</button>
  <select id="mode" title="Quand l'IA veut modifier tes fichiers"><option value="ask">Demander avant de modifier</option><option value="auto">Auto : modifier directement</option></select>
  <button class="link ghost" id="undoBtn" hidden title="Annuler les dernières modifications d'Agora">Annuler</button>
</div>
<div id="log"></div>
<div class="bottom">
  <div id="slash"></div>
  <div class="ctx" id="ctxRow"></div>
  <div class="box"><textarea id="input" rows="1" placeholder="Demande à Agora… (/ pour les codes)"></textarea><button id="send">Envoyer</button></div>
  <div class="hint">Entrée pour envoyer · Maj+Entrée pour aller à la ligne · clic droit sur du code → Agora</div>
</div>
<script nonce="%NONCE%">
const vscode = acquireVsCodeApi();
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let state = {}, busy = false, cur = null, curText = '';
const saved = vscode.getState() || { html:'' };
const CODES = [
  ['explique','Explique le fichier ou la sélection','Explique ce code simplement, étape par étape.'],
  ['debug','Trouve et corrige le bug','Trouve le bug, explique la cause en une phrase et donne le code corrigé complet.'],
  ['review','Revue de code façon senior','Fais une code review : bugs, sécurité, performance, lisibilité, avec les corrections.'],
  ['refactor','Code plus propre, même comportement','Refactorise ce code sans changer son comportement. Code complet puis changements en 3 points.'],
  ['optimize','Plus rapide et plus léger','Optimise ce code (performances, mémoire, ressources). Estime le gain.'],
  ['test','Écrit des tests','Écris des tests pour ce code, y compris les cas limites.'],
  ['security','Audit de sécurité','Fais un audit de sécurité : problèmes classés par gravité, exploitation possible, correctif en code.'],
  ['doc','Documentation','Écris la documentation de ce code (rôle, paramètres, exemples), au format adapté au langage.'],
  ['commit','Message de commit','Écris un message de commit au format Conventional Commits pour ces changements.'],
  ['fxmanifest','fxmanifest.lua complet (FiveM)','Écris un fxmanifest.lua complet et commenté adapté à cette ressource FiveM.'],
];

function md(src){
  const parts = src.split(/```/); let html = '';
  parts.forEach((p, i) => {
    if (i % 2){
      const nl = p.indexOf('\n'); const lang = nl > -1 ? p.slice(0, nl).trim() : ''; const code = nl > -1 ? p.slice(nl + 1).replace(/\n$/, '') : p;
      const closed = i < parts.length - 1;
      html += `<div class="code" data-lang="${esc(lang)}"><div class="bar"><span>${esc(lang || 'code')}</span>${closed ? '<button data-a="copy">Copier</button><button data-a="insert">Insérer</button><button data-a="replace">Remplacer la sélection</button><button data-a="newfile">Nouveau fichier</button>' : ''}</div><pre><code>${esc(code)}</code></pre></div>`;
    } else {
      const t = esc(p).replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>').replace(/(^|\s)\*([^*\n]+)\*/g, '$1<i>$2</i>')
        .replace(/^#{1,6}\s+(.+)$/gm, '<h4>$1</h4>');
      html += t.split(/\n{2,}/).map(b => {
        if (/^\s*([-*]|\d+\.)\s/.test(b)){ const ol = /^\s*\d+\./.test(b); return `<${ol?'ol':'ul'}>` + b.split('\n').filter(Boolean).map(l => `<li>${l.replace(/^\s*([-*]|\d+\.)\s/, '')}</li>`).join('') + `</${ol?'ol':'ul'}>` }
        return b.trim() ? (b.startsWith('<h4>') ? b : `<p>${b.replace(/\n/g, '<br>')}</p>`) : '';
      }).join('');
    }
  });
  return html;
}
function save(){ vscode.setState({ html: $('#log').innerHTML }) }
function empty(){
  $('#log').innerHTML = `<div class="empty"><img src="%ICON%" alt=""><b>Agora</b><span>Pose une question, ou sélectionne du code et fais clic droit → Agora. Agora peut lire et modifier les fichiers du dossier ouvert.</span><div class="chips"><button data-q="/explique">Expliquer ce fichier</button><button data-q="/debug">Trouver le bug</button><button data-q="/review">Revue de code</button></div></div>`;
}
function scroll(){ const l = $('#log'); l.scrollTop = l.scrollHeight }
function addUser(t){ $('#log').querySelector('.empty')?.remove(); const d = document.createElement('div'); d.className = 'u'; d.textContent = t; $('#log').append(d); scroll() }
function setBusy(b){ busy = b; $('#send').textContent = b ? 'Stop' : 'Envoyer' }

$('#log').innerHTML = saved.html || ''; if (!saved.html) empty();
$('#log').addEventListener('click', e => {
  const q = e.target.closest('[data-q]'); if (q){ $('#input').value = q.dataset.q + ' '; submit(); return }
  const b = e.target.closest('[data-a]'); if (b){
    const box = b.closest('.code'); const code = box.querySelector('code').textContent;
    if (b.dataset.a === 'copy'){ navigator.clipboard.writeText(code).then(() => { b.textContent = 'Copié'; setTimeout(() => b.textContent = 'Copier', 1200) }) }
    else vscode.postMessage({ type:'insert', code, mode:b.dataset.a === 'insert' ? 'cursor' : b.dataset.a, lang: box.dataset.lang });
  }
  const l = e.target.closest('[data-link]'); if (l) vscode.postMessage({ type:'link', provider:l.dataset.link });
  const pa = e.target.closest('[data-p]'); if (pa){
    const card = pa.closest('.prop'), id = card.dataset.id, act = pa.dataset.p;
    if (act === 'diff') vscode.postMessage({ type:'diff', id, path:pa.dataset.path });
    if (act === 'one') vscode.postMessage({ type:'apply', id, paths:[pa.dataset.path] });
    if (act === 'all') vscode.postMessage({ type:'apply', id, paths:[...card.querySelectorAll('[data-path]')].map(x => x.dataset.path).filter((v, i, a) => a.indexOf(v) === i) });
    if (act === 'skip'){ vscode.postMessage({ type:'discard', id }); card.classList.add('done'); card.querySelector('.acts').innerHTML = '<span class="info">Ignoré</span>'; card.querySelectorAll('.frow button').forEach(b => b.remove()); save() }
  }
  if (e.target.closest('[data-open-folder]')) vscode.postMessage({ type:'openFolder' });
});
function submit(){
  if (busy){ vscode.postMessage({ type:'stop' }); return }
  let t = $('#input').value.trim(); if (!t) return;
  const m = t.match(/^\/(\S+)\s*([\s\S]*)$/); let shown = t;
  if (m){ const c = CODES.find(x => x[0] === m[1].toLowerCase()); if (c){ t = c[2] + (m[2] ? '\n\n' + m[2] : '') } }
  addUser(shown); $('#input').value = ''; resize(); hideSlash();
  vscode.postMessage({ type:'send', text:t });
}
function resize(){ const i = $('#input'); i.style.height = 'auto'; i.style.height = Math.min(i.scrollHeight, 160) + 'px' }
let slashSel = 0;
function showSlash(){
  const q = $('#input').value.slice(1).toLowerCase(); const list = CODES.filter(c => c[0].startsWith(q));
  const box = $('#slash'); if (!list.length){ hideSlash(); return }
  slashSel = Math.min(slashSel, list.length - 1);
  box.innerHTML = list.map((c, i) => `<button data-c="${c[0]}" class="${i === slashSel ? 'on' : ''}"><b>/${c[0]}</b><span>${esc(c[1])}</span></button>`).join(''); box.style.display = 'flex';
  box.querySelectorAll('button').forEach(b => b.onclick = () => { $('#input').value = '/' + b.dataset.c + ' '; hideSlash(); $('#input').focus() });
}
function hideSlash(){ $('#slash').style.display = 'none' }
$('#input').addEventListener('input', () => { resize(); const v = $('#input').value; if (v.startsWith('/') && !/\s/.test(v)) showSlash(); else hideSlash() });
$('#input').addEventListener('keydown', e => {
  const open = $('#slash').style.display === 'flex';
  if (open && (e.key === 'ArrowDown' || e.key === 'ArrowUp')){ e.preventDefault(); slashSel += e.key === 'ArrowDown' ? 1 : -1; if (slashSel < 0) slashSel = 0; showSlash(); return }
  if (open && (e.key === 'Tab' || e.key === 'Enter')){ e.preventDefault(); $('#slash .on')?.click(); return }
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); submit() }
});
$('#send').onclick = submit;
$('#prov').onchange = e => vscode.postMessage({ type:'setProvider', provider:e.target.value });
$('#model').onchange = e => vscode.postMessage({ type:'setModel', model:e.target.value });
$('#model').onfocus = () => { if ($('#model').dataset.loaded !== state.provider) vscode.postMessage({ type:'listModels' }) };
$('#linkBtn').onclick = () => vscode.postMessage({ type:'link', provider:state.provider });
$('#mode').onchange = e => vscode.postMessage({ type:'setAuto', value: e.target.value === 'auto' });
$('#undoBtn').onclick = () => vscode.postMessage({ type:'undo' });

window.addEventListener('message', ({ data:m }) => {
  if (m.type === 'state'){
    state = m;
    $('#prov').innerHTML = m.providers.map(p => `<option value="${p.id}" ${p.id === m.provider ? 'selected' : ''}>${esc(p.name)}${p.linked ? '' : ' (non lié)'}</option>`).join('');
    if ($('#model').dataset.loaded !== m.provider) $('#model').innerHTML = `<option>${esc(m.model)}</option>`;
    else [...$('#model').options].forEach(o => o.selected = o.value === m.model);
    const p = m.providers.find(x => x.id === m.provider); $('#linkBtn').hidden = !p || p.linked;
    $('#mode').value = m.autoApply ? 'auto' : 'ask'; $('#mode').hidden = !m.hasFolder; $('#undoBtn').hidden = !m.canUndo;
    $('#ctxRow').innerHTML = m.context ? `Contexte : <button id="ctxBtn" class="${m.includeFile ? '' : 'off'}" title="Cliquer pour activer ou désactiver">${esc(m.context.name)} · ${esc(m.context.range)}</button>` : 'Aucun fichier ouvert';
    $('#ctxBtn')?.addEventListener('click', () => vscode.postMessage({ type:'toggleFile' }));
  }
  if (m.type === 'models'){
    const list = m.list.length ? m.list : [state.model];
    $('#model').innerHTML = list.map(id => `<option ${id === state.model ? 'selected' : ''}>${esc(id)}</option>`).join('');
    $('#model').dataset.loaded = state.provider;
  }
  if (m.type === 'userEcho') addUser(m.text);
  if (m.type === 'start'){
    setBusy(true); curText = '';
    cur = document.createElement('div'); cur.className = 'a'; cur.innerHTML = `<div class="who">${esc(m.model)}</div><div class="tools"></div><div class="body cursor"></div>`;
    $('#log').querySelector('.empty')?.remove(); $('#log').append(cur); scroll();
  }
  if (m.type === 'delta' && cur){ curText += m.text; cur.querySelector('.body').innerHTML = md(curText); scroll() }
  if (m.type === 'done'){ cur?.querySelector('.body').classList.remove('cursor'); if (cur && !curText) cur.querySelector('.body').textContent = cur.querySelector('.tools').childElementCount ? 'Terminé.' : '(réponse vide)'; cur = null; setBusy(false); save() }
  if (m.type === 'approve'){
    const d = document.createElement('div'); d.className = 'ap'; d.dataset.req = m.reqId;
    const cls = { '+':'a', '-':'r', '…':'s', ' ':'' };
    d.innerHTML = `<div class="h">${m.isNew ? 'Créer' : 'Modifier'} <b title="${esc(m.path)}">${esc(m.path)}</b><span class="p">+${m.add}</span><span class="m">−${m.del}</span></div>`
      + `<div class="d">${m.diff.map(o => `<div class="${cls[o.t] || ''}">${o.t === '…' ? '⋯' : esc((o.t === ' ' ? '  ' : o.t + ' ') + o.l)}</div>`).join('')}</div>`
      + `<div class="q"><span>Appliquer cette modification ?</span><button class="y" data-d="yes">Accepter</button><button data-d="always">Toujours accepter</button><button data-d="no">Refuser</button><button data-d="view">Voir</button></div>`;
    d.querySelector('.q').onclick = e => { const b = e.target.closest('[data-d]'); if (!b) return;
      if (b.dataset.d === 'view'){ vscode.postMessage({ type:'showDiff', reqId:m.reqId, path:m.path }); return }
      vscode.postMessage({ type:'approval', reqId:m.reqId, decision:b.dataset.d });
      d.classList.add('done'); d.querySelector('.q').innerHTML = b.dataset.d === 'no' ? '<span>Refusé</span>' : `<span class="ok">✓ Appliqué${b.dataset.d === 'always' ? ' · les suivantes seront acceptées automatiquement' : ''}</span>`; save() };
    (cur ? cur.querySelector('.tools') : $('#log')).append(d); scroll(); save();
  }
  if (m.type === 'error'){
    setBusy(false); if (cur) cur.remove(); cur = null;
    const d = document.createElement('div'); d.className = 'err';
    d.innerHTML = esc(m.msg) + (/pas lié|clé/.test(m.msg) ? ` <button data-link="${esc(state.provider)}">Lier maintenant</button>` : '');
    $('#log').append(d); scroll(); save();
  }
  if (m.type === 'clear'){ empty(); save() }
  if (m.type === 'info'){ const d = document.createElement('div'); d.className = 'info'; d.textContent = m.text; (cur ? cur.querySelector('.tools') : $('#log')).append(d); scroll(); save() }
  if (m.type === 'proposal'){
    const d = document.createElement('div'); d.className = 'prop'; d.dataset.id = m.id;
    d.innerHTML = `<b>Agora propose de modifier ${m.files.length} fichier${m.files.length > 1 ? 's' : ''}</b>` + m.files.map(f => `<div class="frow"><span class="fn" title="${esc(f.path)}">${esc(f.path)}</span>${f.isNew ? '<span class="new">nouveau</span>' : ''}<span class="st"><span class="p">+${f.add}</span> <span class="m">−${f.del}</span></span><button data-p="diff" data-path="${esc(f.path)}">Voir</button><button data-p="one" data-path="${esc(f.path)}">Appliquer</button></div>`).join('')
      + `<div class="acts"><button class="pri" data-p="all">Tout appliquer</button><button data-p="skip">Ignorer</button></div>`;
    $('#log').append(d); scroll(); save();
  }
  if (m.type === 'applied'){
    let card = $('#log').querySelector(`.prop[data-id="${m.id}"]`);
    if (!card){ card = document.createElement('div'); card.className = 'prop'; card.dataset.id = m.id; card.innerHTML = '<b>Modifications appliquées automatiquement</b><div class="acts"></div>'; $('#log').append(card) }
    m.paths.forEach(pth => { const row = [...card.querySelectorAll('.frow')].find(r => r.querySelector('.fn').textContent === pth);
      if (row){ row.querySelectorAll('button').forEach(b => b.remove()); row.insertAdjacentHTML('beforeend', '<span class="ok">✓ appliqué</span>') }
      else card.querySelector('.acts').insertAdjacentHTML('beforebegin', `<div class="frow"><span class="fn">${esc(pth)}</span><span class="ok">✓ appliqué</span></div>`) });
    if (m.errors?.length) card.insertAdjacentHTML('beforeend', `<div class="err">${m.errors.map(esc).join('<br>')}</div>`);
    if (!card.querySelector('.frow button')){ card.classList.add('done'); card.querySelector('.acts').innerHTML = '<button data-undo>Annuler ces modifications</button>' }
    card.querySelector('[data-undo]')?.addEventListener('click', () => vscode.postMessage({ type:'undo' }));
    scroll(); save();
  }
});
vscode.postMessage({ type:'ready' });
</script>
</body>
</html>
